<meta property="og:title" content="Dex League">
<meta property="og:description" content="Roll a type, draft a Pokémon, build a squad, sim the season. Play your friends with a squad code.">

<style>
/* Layout: one column "playbook" page. Roll panel on top, results next, two-sided lineup (offense / defense) below. */
:root {
  --bg: #E9EFF4;
  --surface: #FFFFFF;
  --surface-2: #F2F6FA;
  --ink: #0D1B2E;
  --muted: #566A80;
  --line: #CFD9E3;
  --accent: #F0B400;
  --accent-ink: #1A1300;
  --meter: #1F7A4D;
  --win: #1B8A4B;
  --loss: #C23A3A;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A121D;
    --surface: #121D2C;
    --surface-2: #182638;
    --ink: #E8EEF5;
    --muted: #93A5BA;
    --line: #26384D;
    --accent: #F5BE1E;
    --accent-ink: #1A1300;
    --meter: #3FBF80;
    --win: #3FBF80;
    --loss: #EF6B6B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A121D;
  --surface: #121D2C;
  --surface-2: #182638;
  --ink: #E8EEF5;
  --muted: #93A5BA;
  --line: #26384D;
  --accent: #F5BE1E;
  --accent-ink: #1A1300;
  --meter: #3FBF80;
  --win: #3FBF80;
  --loss: #EF6B6B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 52ch; }

.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.progress { display: flex; align-items: center; gap: 12px; }
.progress .num { font-family: var(--font-mono); font-weight: 700; font-size: 14px; min-width: 52px; }
.pbar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }

.btn { border: 0; border-radius: 10px; padding: 14px 18px; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; transform: none; }
.btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-size: 18px; padding: 11px 16px; }
.btn.alt:hover { border-color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.btnrow > * { flex: 1 1 180px; }

.tp { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.tp i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.cands { display: grid; gap: 10px; }
.cand { text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; animation: rise .25s ease backwards; }
.cand:hover { border-color: var(--muted); }
.cand[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
.cand-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.nm { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; }
.types { display: flex; gap: 5px; flex-wrap: wrap; }
.ab { font-size: 13px; color: var(--muted); }
.ab b { color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 16px; }
.st { display: grid; grid-template-columns: 30px 1fr 28px; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.st em { font-style: normal; color: var(--ink); text-align: right; font-weight: 700; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--meter); border-radius: inherit; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.recs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.recs small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 2px; }
.rec { display: inline-flex; align-items: baseline; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 12px; }
.rec b { font-weight: 700; }
.rec em { font-style: normal; color: var(--muted); }
.rec span { font-family: var(--font-body); font-size: 12px; font-weight: 600; }
.rec.top { border-color: var(--meter); }
.rec.top em { color: var(--ink); font-weight: 700; }
.gm { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gsub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 11px; color: var(--muted); }
.tdot { display: inline-flex; align-items: center; gap: 4px; }
.tdot i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.edge { font-style: normal; font-family: var(--font-mono); font-weight: 700; color: var(--muted); }
.edge.up { color: var(--win); }
.edge.dn { color: var(--loss); }
.wk.dim { opacity: .62; }
.res.nx { background: var(--accent); color: var(--accent-ink); font-size: 9px; letter-spacing: .02em; padding: 2px 0; }
.wk.plain { grid-template-columns: 34px 1fr; animation: none; }
.sched summary { cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.mode { text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mode b { font-family: var(--font-display); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.mode small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
.picker { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
.picker h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; }
.slotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slotbtn { text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; min-width: 0; }
.slotbtn:hover { border-color: var(--accent); }
.slotbtn.best { border-color: var(--meter); }
.pos { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.04em; line-height: 1; }
.sc { font-family: var(--font-mono); font-weight: 700; font-size: 15px; }
.slotbtn .bar { grid-column: 1 / -1; }
.need { grid-column: 1 / -1; font-size: 11px; color: var(--muted); font-family: var(--font-mono); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip.neg { background: var(--loss); }
.chip { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; background: var(--meter); color: var(--bg); }

.side { display: flex; flex-direction: column; gap: 10px; }
.side h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; display: flex; justify-content: space-between; align-items: baseline; }
.side h2 span { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 76px; }
.slot.open { background: transparent; border-style: dashed; color: var(--muted); }
.slot .row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.slot .who { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; line-height: 1.2; }
.slot .mini { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

.record { font-family: var(--font-display); font-weight: 900; font-size: 88px; line-height: .9; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.record.perfect { color: var(--accent); }
.verdict { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 0.04em; }
.ratings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rt { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.rt small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.rt b { font-family: var(--font-mono); font-size: 20px; }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; margin: 0; padding: 0; list-style: none; }
.wk { display: grid; grid-template-columns: 34px 1fr 38px 58px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; animation: rise .25s ease backwards; }
.wk .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.wk .ch { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }
.res { font-family: var(--font-mono); font-weight: 700; text-align: center; border-radius: 6px; padding: 1px 0; font-size: 13px; }
.res.w { color: var(--win); background: color-mix(in srgb, var(--win) 14%, transparent); }
.res.l { color: var(--loss); background: color-mix(in srgb, var(--loss) 14%, transparent); }
textarea { width: 100%; min-height: 76px; resize: vertical; font-family: var(--font-mono); font-size: 12px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
footer { color: var(--muted); font-size: 12px; max-width: 62ch; }


.legend { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.6; }
.sub { margin: 4px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 8px; }
.award { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.award small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.award b { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; overflow-wrap: break-word; }
.award span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.recap p { margin: 6px 0 0; max-width: 62ch; }


.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-top: 6px; }
.setup { display: flex; flex-direction: column; gap: 14px; }
.setup .hint { margin-top: -4px; }
.mode small.s2 { font-family: var(--font-body); }
.strip { display: flex; flex-wrap: wrap; gap: 2px; }
.strip i { width: 9px; height: 14px; border-radius: 2px; background: var(--line); display: block; }
.strip i.w { background: var(--win); }
.strip i.l { background: var(--loss); }
.strip i.d { background: var(--muted); }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; padding: 4px 0; }
.res.d { color: var(--muted); background: color-mix(in srgb, var(--muted) 16%, transparent); }
.wk { grid-template-columns: 34px 1fr 38px minmax(58px, auto); }
.wk.plain { grid-template-columns: 40px 1fr; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-family: var(--font-mono); }
.tbl th { text-align: right; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 6px; }
.tbl th:nth-child(2), .tbl td:nth-child(2) { text-align: left; }
.tbl td { padding: 5px 6px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.tbl td:nth-child(2) { font-family: var(--font-body); font-size: 14px; }
.tbl tr.me td { background: color-mix(in srgb, var(--accent) 22%, transparent); font-weight: 700; }
.tbl tr.gap td { text-align: center; color: var(--muted); padding: 1px; border-top: 0; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.plan { text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plan:hover { border-color: var(--accent); }
.plan b { font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.plan small { font-size: 12px; color: var(--muted); }
.plan em { font-style: normal; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--muted); }
.plan em.up { color: var(--win); }
.plan em.dn { color: var(--loss); }
.plan.best { border-color: var(--meter); }
.trophy { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); vertical-align: middle; margin-left: 6px; }
.ratings { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.record.small { font-size: 56px; }
.comp h3.sub { display: flex; align-items: center; }


.topbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
input[type="text"], input:not([type]) { font: inherit; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; }
.roomrow { display: flex; gap: 8px; align-items: stretch; margin-top: 6px; }
.roomrow input { flex: 1; text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-mono); }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fld input { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 500; color: var(--ink); }
.share { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
#sqCode, #codes { font-family: var(--font-mono); font-size: 12px; min-height: 64px; }
#codes { min-height: 110px; }
.sqs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sq { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
.sqhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sqhead b { font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; display: block; line-height: 1.05; }
.sqhead small { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.lu { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 14px; }
.lu li { display: grid; grid-template-columns: 38px 1fr auto; gap: 6px; font-size: 13px; align-items: baseline; }
.lu .pos { font-size: 14px; }
.lu em { font-style: normal; font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.cnt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 500; }
.vsview #schedule, .vsview #rollPanel, .vsview #resultPanel, .vsview #lineup, .vsview .progress, .vsview .lede { display: none; }

@media (max-width: 420px) {
  h1 { font-size: 40px; }
  .record { font-size: 76px; }
}
@media (prefers-reduced-motion: reduce) {
  .cand, .wk { animation: none; }
  .pbar i { transition: none; }
}

/* Portraits and boards */
.board { position: relative; width: 100%; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -24px 40px rgba(0,0,0,.18); background-size: 100% 100%; }
.board::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-size: 100% 100%, 180px 180px; background-blend-mode: normal, overlay; }
.b-soccer { background: repeating-linear-gradient(180deg, #2E7D4B 0 8.33%, #38905A 8.33% 16.66%); }

function parseMons(raw, legendary) {
  return raw.trim().split('\n').map(line => {
    const [name, types, stats, ability] = line.split('|');
    const [hp, atk, def, spa, spd, spe] = stats.split(',').map(Number);
    const sz = SIZE[name] || [1.2, 50];
    return { name, types: types.split('/'), stats: { hp, atk, def, spa, spd, spe }, ability, legendary, height: sz[0], weight: sz[1] };
  });
}
const MONS = parseMons(RAW, false);

/* Size percentiles within the whole pool, so "heavy" and "tall" are relative to these Pokémon. */
{
  const all = [...MONS, ...LEGENDS];
  const sw = all.map(m => m.weight).sort((a, b) => a - b), sh = all.map(m => m.height).sort((a, b) => a - b);
  const pct = (arr, v) => { let lt = 0, eq = 0; for (const x of arr) { if (x < v) lt++; else if (x === v) eq++; } return (lt + eq / 2) / arr.length * 100; };
  all.forEach(m => { m.wPct = pct(sw, m.weight); m.hPct = pct(sh, m.height); });
}

function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

/* Spread a pool of clubs over a rating range, in a fixed order, and lay out a schedule of n games. */
function buildTeams(pool, count, lo, hi, seed, styles, ratingList) {
  const picked = seededShuffle(pool, seed).slice(0, count);
  const ranks = seededShuffle(picked.map((_, i) => i), seed + 7);
  const st = styles ? seededShuffle(styles, seed + 13) : null;
  return picked.map((c, i) => ({
    name: c[0], types: c[1],
    rating: ratingList ? ratingList[ranks[i]] : Math.round((lo + (hi - lo) * ranks[i] / Math.max(1, count - 1)) * 10) / 10,
    style: st ? st[i % st.length] : undefined
  }));
}
function buildSchedule(teams, games, seed) {
  const list = [];
  for (let i = 0; i < games; i++) list.push(teams[i % teams.length]);
  return seededShuffle(list, seed).map((t, i) => ({ name: t.name, types: t.types, rating: t.rating, style: t.style, tag: i + 1 }));
}

const SPORTS = { football: buildFootball(), basketball: buildBasketball(), soccer: buildSoccer(), baseball: buildBaseball() };
const SPORT_ORDER = ['football', 'basketball', 'soccer', 'baseball'];

/* ---------- Context: which sport, competition, squad and formation are in play ---------- */
const CUR = { sportKey: 'football', fmtKey: 'season', mode: 'both', formation: null };
function setCtx(o) {
  const next = Object.assign({}, CUR, o);
  const sp = SPORTS[next.sportKey] || SPORTS.football;
  next.sportKey = sp.key;
  if (!sp.formats[next.fmtKey]) next.fmtKey = Object.keys(sp.formats)[0];
  const f = sp.formats[next.fmtKey];
  const ms = f.modes || sp.modes;
  if (!ms[next.mode]) next.mode = Object.keys(ms)[0];
  if (sp.formations) { if (!sp.formations[next.formation]) next.formation = sp.defaultFormation; } else next.formation = null;
  Object.assign(CUR, next);
}
const SP = () => SPORTS[CUR.sportKey];
const FMT = () => SP().formats[CUR.fmtKey];
const MODESET = () => FMT().modes || SP().modes;
const MODE = () => MODESET()[CUR.mode];
function allSlots() {
  const f = FMT(), sp = SP();
  return f.slots || (sp.formations ? sp.formations[CUR.formation].slots : sp.slots);
}
function activeSlots() { const sides = MODE().sides; return allSlots().filter(s => sides.includes(s.side)); }
function sideWeights() {
  const sp = SP(), m = MODE();
  if (m.weights) return m.weights;
  return sp.formations ? sp.formations[CUR.formation].weights : {};
}
setCtx({});

/* ---------- Size: percentiles within the whole pool ---------- */
const SIZE_KW = 0.35, SIZE_KH = 0.12, SIZE_MAX = 24;
const outside = (v, [lo, hi]) => v < lo ? lo - v : v > hi ? v - hi : 0;
function sizePenalty(mon, slot) {
  const b = slot.body;
  return Math.min(SIZE_MAX, SIZE_KW * outside(mon.wPct, b.w) + SIZE_KH * outside(mon.hPct, b.h));
}

/* Grade a Pokémon at a spot: its best archetype, plus a trait bonus when its ability suits the position. */
function fit(mon, slot) {
  let base = -1, arch = null;
  const g = slot.geo || 0;
  for (const a of slot.archs) {
    let v = 0, lnv = 0;
    for (const k of STAT_KEYS) {
      const x = Math.min(1, mon.stats[k] / NORM);
      v += a.w[k] * x;
      if (g && a.w[k]) lnv += a.w[k] * Math.log(Math.max(0.12, x));
    }
    v *= 100;
    if (g) v = (1 - g) * v + g * Math.exp(lnv) * 100;
    if (v > base) { base = v; arch = a; }
  }
  const trait = TRAIT_OF[mon.ability] || null;
  const bonus = trait && slot.traits.includes(trait) ? slot.bonus : 0;
  let anat = 0; const anatTags = [];
  if (slot.anat) {
    let up = 0;
    for (const tg of mon.anat) { const v = slot.anat[tg]; if (v > 0) { up += v; anatTags.push([tg, v]); } else if (v < 0) { anat += v; anatTags.push([tg, v]); } }
    anat += Math.min(22, up);
  }
  const pen = sizePenalty(mon, slot);
  return { score: Math.max(0, Math.min(100, base + bonus + anat - pen)), base, bonus, anat, anatTags, pen, trait, arch: arch.name, archW: arch.w };
}
function archNames(slot) { return slot.archs.map(a => a.name).join(' / '); }
/* The stats a position leans on most, for the "needs" line on empty spots. */
function slotNeeds(slot) {
  const tot = {};
  for (const a of slot.archs) for (const k of STAT_KEYS) tot[k] = Math.max(tot[k] || 0, a.w[k]);
  return STAT_KEYS.filter(k => tot[k] >= 0.2).sort((p, q) => tot[q] - tot[p]).slice(0, 3);
}
function rows(lineup) {
  return allSlots().filter(s => lineup[s.id]).map(s => ({ slot: s, mon: lineup[s.id], f: fit(lineup[s.id], s) }));
}
function sideRating(lineup, side) {
  let t = 0, w = 0;
  for (const r of rows(lineup)) if (r.slot.side === side) { t += r.f.score * r.slot.imp; w += r.slot.imp; }
  return w ? t / w : 0;
}
function chemistry(lineup) {
  const set = new Set();
  Object.values(lineup).forEach(m => m.types.forEach(t => set.add(t)));
  const m = MODE();
  return Math.max(0, Math.min(m.chemCap, (set.size - m.chemNeed) * 0.5));
}
function teamRating(lineup) {
  const m = MODE(), w = sideWeights(), sides = {};
  let num = 0, den = 0;
  for (const s of m.sides) { sides[s] = sideRating(lineup, s); const wt = w[s] === undefined ? 1 : w[s]; num += wt * sides[s]; den += wt; }
  const chem = chemistry(lineup);
  return { sides, chem, mode: CUR.mode, overall: (den ? num / den : 0) + chem + m.offset };
}

/* ---------- Type matchups ---------- */
const MATCH_K = 12;       // rating points per unit of average matchup edge
const MATCH_BASE = 0.12;  // the edge a typical Pokémon already has, so an average lineup nets about zero
function matchupAdj(lineup, opp) {
  if (!opp || !opp.length) return 0;
  let t = 0, w = 0;
  for (const r of rows(lineup)) { t += monEdge(r.mon, opp) * r.slot.imp; w += r.slot.imp; }
  return w ? Math.max(-8, Math.min(8, (t / w - MATCH_BASE) * MATCH_K)) : 0;
}

/* ---------- Game plans (soccer): press beats possession, possession beats counter, counter beats press ---------- */
const PLAN_K = 3.5;
const BEATS = { press: 'poss', poss: 'counter', counter: 'press' };
function planAdj(plan, style) {
  if (!SP().plans || !plan || plan === 'bal' || !style) return 0;
  if (BEATS[plan] === style) return PLAN_K;
  if (BEATS[style] === plan) return -PLAN_K;
  return 0;
}
function bestPlanFor(style) {
  if (!SP().plans) return null;
  for (const k of ['press', 'poss', 'counter']) if (BEATS[k] === style) return k;
  return 'bal';
}
function bestSeasonPlan(def) {
  if (!SP().plans) return null;
  let best = 'bal', bv = 0;
  for (const k of ['press', 'poss', 'counter']) {
    const v = def.games.reduce((a, g) => a + planAdj(k, g.style), 0);
    if (v > bv) { bv = v; best = k; }
  }
  return best;
}
function planTally(def, plan) {
  let fav = 0, exp = 0;
  for (const g of def.games) { const a = planAdj(plan, g.style); if (a > 0) fav++; else if (a < 0) exp++; }
  return { fav, exp };
}

/* ---------- Probability and simulation ---------- */

    if (!SPORTS[sportKey]) return bad;
    return withCtx({ sportKey, fmtKey, mode, formation: form === '-' ? null : form }, () => {
      if (CUR.sportKey !== sportKey || CUR.fmtKey !== fmtKey || CUR.mode !== mode || (CUR.formation || '-') !== form) return bad;
      const slots = activeSlots();
      if (ids.length !== slots.length * 2) return { error: 'That code is for a different squad size.' };
      const lineup = {};
      for (let i = 0; i < slots.length; i++) {
        const m = POOL[parseInt(ids.slice(i * 2, i * 2 + 2), 36)];
        if (!m) return { error: 'That code looks damaged.' };
        lineup[slots[i].id] = m;
      }
      return { name: nm.replace(/_/g, ' ') || 'Squad', ctx: ctxOf(), lineup, t: teamRating(lineup), key: sportKey + '|' + fmtKey, code: String(code).trim() };
    });
  } catch (e) { return bad; }
}

/* Type edge between two whole squads, from A's side: each Pokémon against each opposing Pokémon. */
const PAIR_BASE = 0.2;
function pairAdj(A, B) {
  return withCtx(A.ctx, () => {
    const rs = rows(A.lineup).filter(r => MODE().sides.includes(r.slot.side)), bm = Object.values(B.lineup);
    let t = 0, w = 0;
    for (const r of rs) { let e = 0; for (const m of bm) e += monEdge(r.mon, m.types); t += (e / bm.length) * r.slot.imp; w += r.slot.imp; }
    return w ? Math.max(-8, Math.min(8, (t / w - PAIR_BASE) * MATCH_K)) : 0;
  });
}
function versusGame(A, B, ko) {
  const ra = A.t.overall + pairAdj(A, B), rb = B.t.overall + pairAdj(B, A);
  const r = withCtx(A.ctx, () => playRaw(ra, { rating: rb }, ko));
  return Object.assign({ ra, rb, win: r.res === 'W' }, r);
}
const DUEL_BO = { football: 3, basketball: 7, soccer: 3, baseball: 7 };
const duelBestOf = ctx => (ctx.sportKey === 'baseball' && ctx.fmtKey === 'derby') ? 1 : DUEL_BO[ctx.sportKey];
function versusSeries(A, B) {
  const bo = duelBestOf(A.ctx), need = Math.ceil(bo / 2), games = [];
  let wa = 0, wb = 0;
  while (wa < need && wb < need) { const g = versusGame(A, B, true); games.push(g); if (g.res === 'W') wa++; else wb++; }
  return { bo, games, wa, wb, winner: wa > wb ? A : B, loser: wa > wb ? B : A };
}
/* Everyone plays everyone home and away; the top two meet in a final. */
function versusLeague(squads) {
  const pts = squads[0].ctx.sportKey === 'soccer';
  const tab = squads.map((s, i) => ({ i, s, name: s.name, w: 0, d: 0, l: 0, pf: 0, pa: 0, pts: 0 }));
  const fixtures = [];
  for (let i = 0; i < squads.length; i++) for (let j = 0; j < squads.length; j++) {
    if (i === j) continue;
    const g = versusGame(squads[i], squads[j], false);
    const a = tab[i], b = tab[j];
    a.pf += g.pf; a.pa += g.pa; b.pf += g.pa; b.pa += g.pf;
    if (g.res === 'W') { a.w++; b.l++; a.pts += pts ? 3 : 1; }
    else if (g.res === 'L') { b.w++; a.l++; b.pts += pts ? 3 : 1; }
    else { a.d++; b.d++; a.pts++; b.pts++; }
    fixtures.push({ home: squads[i].name, away: squads[j].name, res: g.res, pf: g.pf, pa: g.pa });
  }
  tab.sort((p, q) => q.pts - p.pts || (q.pf - q.pa) - (p.pf - p.pa) || q.pf - p.pf);
  tab.forEach((r, k) => { r.rank = k + 1; });
  const final = tab.length >= 3 ? versusSeries(tab[0].s, tab[1].s) : null;
  return { tab, fixtures, final, pts };
}
function versusDuel(A, B) { return { final: versusSeries(A, B), duel: true }; }
function versusText(res, squads) {
  const sp = SPORTS[squads[0].ctx.sportKey], lines = [];
  const score = f => Math.max(f.wa, f.wb) + '-' + Math.min(f.wa, f.wb);
  if (res.duel) {
    lines.push(`Dex League duel · ${sp.name}${res.final.bo > 1 ? ' · best of ' + res.final.bo : ''}`);
    lines.push(`${res.final.winner.name} beat ${res.final.loser.name} ${score(res.final)}`);
    return lines.join('\n');
  }
  lines.push(`Dex League friends league · ${sp.name}`);
  res.tab.forEach(r => lines.push(`${r.rank}. ${r.name}  ${sp.key === 'soccer' ? `${r.w}-${r.d}-${r.l}, ${r.pts} pts` : `${r.w}-${r.l}`}`));
  if (res.final) lines.push(`Final: ${res.final.winner.name} beat ${res.final.loser.name} ${score(res.final)}`);
  return lines.join('\n');
}

function renderFinal(run) {

function addCodes(raw) {
  const vs = state.vs, tokens = String(raw).split(/\s+/).map(t => t.trim()).filter(Boolean);
  let added = 0; const problems = [];
  for (const t of tokens) {
    const d = decodeSquad(t);
    if (d.error) { problems.push(d.error); continue; }
    if (vs.squads.length && vs.squads[0].key !== d.key) { problems.push(`${d.name} is a ${SPORTS[d.ctx.sportKey].name} squad, but this group is ${SPORTS[vs.squads[0].ctx.sportKey].name}.`); continue; }
    if (vs.squads.some(q => q.code === d.code)) { problems.push(`${d.name} is already added.`); continue; }
    if (vs.squads.length >= 16) { problems.push('That is the most squads one league can hold (16).'); break; }
    let nm = d.name, k = 2; while (vs.squads.some(q => q.name === nm)) nm = d.name + ' ' + k++;
    d.name = nm; vs.squads.push(d); added++;
  }
  vs.res = null;
  vs.msg = (added ? `Added ${added} squad${added === 1 ? '' : 's'}. ` : '') + problems.join(' ');
  if (!tokens.length) vs.msg = 'Paste at least one squad code first.';
}

  if (a === 'copyCode') { copyText(myCode(), b, 'Copy code', $('#sqCode')); return; }
  if (a === 'copyLink') { copyText(location.href.split('#')[0] + '#squad=' + encodeURIComponent(myCode()), b, 'Copy link'); return; }
  if (a === 'newRoom') { state.room = newRoomCode(); render(); return; }
  if (a === 'copyInvite') {
    const ri = $('#roomInput'); if (ri) state.room = cleanRoom(ri.value);
    copyText(`Join my Dex League draft room: ${state.room}` + (canLink() ? '\n' + location.href.split('#')[0] + '#room=' + state.room : ''), b, 'Copy invite'); return;
  }
  if (a === 'playSeason') { playSeasonStep(run, state.lineup, b.dataset.plan || null); render(); scrollToEl('#resultCard'); return; }
  if (a === 'startKo') { startKo(run); render(); scrollToEl('#resultCard'); return; }
  if (a === 'playRound') { playKoStep(run, state.lineup, b.dataset.plan || null); render(); scrollToEl('#resultCard'); return; }
  if (a === 'simRest') { while (run.ko) playKoStep(run, state.lineup, SP().plans ? 'auto' : null); render(); scrollToEl('#resultCard'); return; }
  if (a === 'roll') {
    const ri = $('#roomInput'); if (ri) state.room = cleanRoom(ri.value);
    const taken = takenSet();
    setRollSeed(state.room, filledCount());
    const type = rollType(taken);
    state.roll = { type, cands: candidatesFor(type, taken), legend: false }; setRollSeed(null, 0); state.sel = null; render();
  } else if (a === 'legend') {
    if (!state.gods && !state.legendLeft) return;
    const ri = $('#roomInput'); if (ri) state.room = cleanRoom(ri.value);
    if (!state.gods) state.legendLeft--; setRollSeed(state.room, 'L' + filledCount()); state.roll = { cands: legendCandidates(takenSet()), legend: true }; setRollSeed(null, 0); state.sel = null; render();
  } else if (a === 'pick') {
    state.sel = Number(b.dataset.i); render(); scrollToEl('#picker');
  } else if (a === 'place') {
    const m = state.roll.cands[state.sel];
    state.lineup[b.dataset.slot] = m; state.roll = null; state.sel = null; render();
    scrollToEl('#rollPanel');
  } else if (a === 'sim' || a === 'resim') {
    startRun();
  } else if (a === 'reset') {
    state.lineup = {}; state.roll = null; state.sel = null; state.legendLeft = 1; state.run = null; render(); window.scrollTo(0, 0);
  } else if (a === 'copy') {
    const ta = $('#share'), btn = $('#copyBtn');
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy result'; }, 1500); };
    const fallback = () => { ta.focus(); ta.select(); btn.textContent = 'Press copy on the selected text'; };
    try { navigator.clipboard.writeText(ta.value).then(done).catch(fallback); } catch (err) { fallback(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'sqName') {
    state.myName = e.target.value;
    const ta = $('#sqCode'); if (ta) ta.value = myCode();
    const sh = $('#share'); if (sh && state.run && state.run.stage === 'final') sh.value = shareText(state.run);
  }
});
applyCtx({});
(function readHash() {
  try {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('room')) state.room = cleanRoom(h.get('room'));
    if (h.get('squad')) { addCodes(h.get('squad')); state.view = 'versus'; }
  } catch (err) { /* ignore a bad link */ }
})();
render();
</script>
</body>
</html>
